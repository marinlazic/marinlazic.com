name: Smoke test the deployed site

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test
        required: true
        default: https://marinlazic-com.vercel.app
      test_email:
        description: Email that receives the test emails
        required: true
        default: marin+smoke@marinlazic.coach

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run smoke test
        id: smoke
        continue-on-error: true
        run: |
          node --experimental-strip-types scripts/smoke.mjs 2>&1 | tee smoke-results.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          BASE_URL: ${{ inputs.base_url }}
          TEST_EMAIL: ${{ inputs.test_email }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Publish results to the smoke-results branch
        run: |
          mkdir -p /tmp/results && cp smoke-results.txt /tmp/results/
          git config user.name "smoke-test"
          git config user.email "smoke-test@users.noreply.github.com"
          git fetch origin smoke-results || true
          git checkout -B smoke-results
          git rm -rfq . || true
          cp /tmp/results/smoke-results.txt .
          echo "run ${{ github.run_id }} at $(date -u +%FT%TZ) against ${{ inputs.base_url }}" > run.txt
          git add smoke-results.txt run.txt
          git commit -qm "Smoke results ${{ github.run_id }}"
          git push -f origin smoke-results
      - name: Fail the job if the smoke test failed
        if: steps.smoke.outputs.exit != '0'
        run: exit 1
